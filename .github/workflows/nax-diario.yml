name: Alertas NAX diarias

on:
  # El disparo principal lo hace Cloudflare a las 6:00 a. m. y 2:00 p. m. RD (worker/robot.js). Estos horarios
  # de GitHub quedan solo de respaldo: llegan con atraso y no hacen nada si el turno ya tuvo una corrida exitosa.
  schedule:
    - cron: '7 12 * * *'
    - cron: '7 20 * * *'
  workflow_dispatch:         # lo usa Cloudflare, y sirve de botón "Run workflow" para correrlo a mano

concurrency:
  group: nax-diario
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  guardia:
    runs-on: ubuntu-latest
    outputs:
      ya: ${{ steps.v.outputs.ya }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "ya=false" >> $GITHUB_OUTPUT; exit 0; fi
          # Turno actual: desde las 6:00 a. m. RD (10:00 UTC) o desde las 2:00 p. m. RD (18:00 UTC).
          H=$(date -u +%H); D=$(date -u +%F)
          if [ "$H" -ge 18 ]; then DESDE="${D}T18:00:00Z"; elif [ "$H" -ge 10 ]; then DESDE="${D}T10:00:00Z"; else DESDE="$(date -u -d yesterday +%F)T18:00:00Z"; fi
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/nax-diario.yml/runs?status=success&created=>=${DESDE}" --jq '.total_count')
          echo "Corridas exitosas desde $DESDE: $N"
          if [ "$N" -gt 0 ]; then echo "ya=true" >> $GITHUB_OUTPUT; else echo "ya=false" >> $GITHUB_OUTPUT; fi

  nax:
    needs: guardia
    if: needs.guardia.outputs.ya != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nax/requirements.txt
      - run: pip install -r nax/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recuperar el histórico de días anteriores
        uses: actions/cache/restore@v4
        with:
          path: |
            nax/historico_actual.csv
            nax/historico_campana_anterior.csv
            nax/historico_retenido.csv
            nax/estado_robot.txt
          key: nax-historico-${{ github.run_id }}
          restore-keys: nax-historico-

      - name: Descargar de NAX y generar el reporte
        env:
          NAX_EMAIL: ${{ secrets.NAX_EMAIL }}
          NAX_PASSWORD: ${{ secrets.NAX_PASSWORD }}
          NAX_CAMPANA: ${{ vars.NAX_CAMPANA }}
          VENTANA_DIAS: ${{ vars.VENTANA_DIAS }}
          DIAS_RECIENTES: ${{ vars.DIAS_RECIENTES }}
          DIAS_INICIALES: ${{ vars.DIAS_INICIALES }}
        run: python nax/nax_diario.py

      - name: Guardar el histórico para mañana
        if: always() && hashFiles('nax/historico_actual.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            nax/historico_actual.csv
            nax/historico_campana_anterior.csv
            nax/historico_retenido.csv
            nax/estado_robot.txt
          key: nax-historico-${{ github.run_id }}

      - name: Publicar en el tablero de GeoCR
        env:
          GEOCR_URL: ${{ vars.GEOCR_URL }}
          GEOCR_INGEST_TOKEN: ${{ secrets.GEOCR_INGEST_TOKEN }}
        run: node nax/publicar.mjs

      - name: Clima diario (NASA POWER + agua de NAX) para el balance hídrico
        if: always()
        continue-on-error: true
        env:
          GEOCR_URL: ${{ vars.GEOCR_URL }}
          GEOCR_INGEST_TOKEN: ${{ secrets.GEOCR_INGEST_TOKEN }}
        run: python nax/clima.py

      - name: Guardar el PDF y el Excel del día (descargables 14 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-nax-${{ github.run_number }}
          path: |
            nax/reporte_nax.pdf
            nax/reporte_nax_casos_criticos.xlsx
          if-no-files-found: ignore
          retention-days: 14
